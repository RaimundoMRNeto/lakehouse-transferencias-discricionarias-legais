metrics:
- metric_name: "Propostas com conv\xEAnio (%)"
  verbose_name: null
  metric_type: count
  expression: "CASE\n    WHEN COUNT(DISTINCT id_proposta) = 0 THEN NULL\n    ELSE\n\
    \        100.0 *\n        COUNT(DISTINCT CASE\n            WHEN numero_convenio\
    \ IS NOT NULL THEN id_proposta\n        END)\n        /\n        COUNT(DISTINCT\
    \ id_proposta)\nEND"
  description: "Propor\xE7\xE3o das propostas presentes no conjunto filtrado que possuem\
    \ instrumento formalizado."
  d3format: null
  currency: null
  extra: null
  warning_text: null
- metric_name: Percentual empenhado
  verbose_name: null
  metric_type: sum
  expression: "CASE\n    WHEN SUM(valor_repasse_convenio) = 0 THEN NULL\n    ELSE\n\
    \        100.0 * SUM(valor_empenhado_convenio)\n        / SUM(valor_repasse_convenio)\n\
    END"
  description: "Percentual empenhado em rela\xE7\xE3o ao valor total de repasse da\
    \ Uni\xE3o."
  d3format: null
  currency: null
  extra: null
  warning_text: null
- metric_name: Percentual desembolsado
  verbose_name: null
  metric_type: sum
  expression: "CASE\n    WHEN SUM(valor_repasse_convenio) = 0 THEN NULL\n    ELSE\n\
    \        100.0 * SUM(valor_desembolsado_convenio)\n        / SUM(valor_repasse_convenio)\n\
    END"
  description: "Percentual efetivamente desembolsado em rela\xE7\xE3o ao repasse pactuado."
  d3format: null
  currency: null
  extra: null
  warning_text: null
