version: 2

sources:
  - name: bronze
    schema: bronze
    description: "Tabelas brutas (Delta Lake) da camada Bronze ingeridas a partir dos dados abertos oficiais do Transferegov (SICONV)."
    tables:
      - name: siconv_proposta
        description: >
          Propostas de trabalho apresentadas por proponentes no Transferegov.
          Grão: 1 linha por proposta de trabalho.
          Chave primária natural: ID_PROPOSTA (100% única e NOT NULL).
          Limitações conhecidas: NR_PROPOSTA representa numeração operacional local de propostas e pode conter repetições legítimas entre diferentes proponentes ou concedentes.
          Colunas técnicas: __ingested_at_utc, __ingestion_run_id, __source_file, __source_sha256.

      - name: siconv_programa_proposta
        description: >
          Tabela associativa (ponte) representando a relação N:N entre programas governamentais e propostas.
          Grão: 1 linha por vínculo Programa × Proposta.
          Chave natural: par composto (ID_PROGRAMA, ID_PROPOSTA) (100% único e NOT NULL).
          Limitações conhecidas: Tabela associativa sujeita à presença de propostas órfãs sem correspondência cadastral e propostas da base sem programas vinculados no Transferegov.
          Colunas técnicas: __ingested_at_utc, __ingestion_run_id, __source_file, __source_sha256.

      - name: siconv_programa
        description: >
          Critérios de elegibilidade e detalhamentos regionais/orçamentários de programas governamentais.
          Grão: 1 linha por combinação de Programa × Modalidade × Natureza Jurídica × UF × Ação Orçamentária.
          Chave técnica de observação: superchave composta de 5 colunas (ID_PROGRAMA, MODALIDADE_PROGRAMA, NATUREZA_JURIDICA_PROGRAMA, UF_PROGRAMA, ACAO_ORCAMENTARIA), garantindo unicidade do critério de elegibilidade.
          Identidade lógica de negócio: ID_PROGRAMA representa a identidade lógica do programa e não é necessariamente único na tabela física de elegibilidade.
          Limitações conhecidas: ID_PROGRAMA NÃO é chave primária desta tabela física bruta; campos temporais podem conter registros históricos atípicos na fonte.
          Colunas técnicas: __ingested_at_utc, __ingestion_run_id, __source_file, __source_sha256.

      - name: siconv_convenio
        description: >
          Instrumentos de repasse / convênios formalizados no Transferegov.
          Grão: 1 observação do instrumento no snapshot oficial.
          Chave de negócio: NR_CONVENIO (NOT NULL, sujeito a múltiplas observações físicas concorrentes no snapshot oficial).
          Limitações conhecidas: Presença de convênios com múltiplas observações simultâneas no mesmo run diferindo unicamente em atributos observacionais como VL_SALDO_CONTA.
          Colunas técnicas: __ingested_at_utc, __ingestion_run_id, __source_file, __source_sha256.
